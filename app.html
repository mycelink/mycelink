<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard, Mycelink</title>
<meta name="description" content="The Mycelink dashboard: TradingView, DexScreener, CoinMarketCap and Checkonchain in one place.">
<meta name="theme-color" content="#05121b">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap dash">

<header class="topbar">
  <a class="brand" href="./"><img src="assets/icon-180.png" alt="" width="36" height="36"><span>Mycelink</span></a>
  <div class="bar-end"><a class="btn" data-account href="account.html" hidden>Sign in</a></div>
</header>

<main>
<h1 class="visually-hidden">Dashboard</h1>
<div class="toolbar">
  <span class="hint" id="hint"></span>
  <button class="btn" type="button" id="split-toggle" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.75" y="2.75" width="14.5" height="12.5" rx="2.5"/><path d="M9 2.75v12.5"/></svg><span>Split view</span></button>
</div>
<div class="panes" id="panes"></div>
<noscript><p>The dashboard needs JavaScript turned on to show the charts.</p></noscript>
</main>

<footer class="footer" style="margin-top:32px">
  <div class="row">
    <h2>Follow Mycelink</h2>
    <div class="socials">
      <a data-social="instagram" href="#">Instagram</a>
      <a data-social="youtube" href="#">YouTube</a>
      <a data-social="tiktok" href="#">TikTok</a>
    </div>
  </div>
  <p class="small">Charts and data belong to the tools named above. Mycelink is free and is not financial advice.</p>
  <p class="legal"><a href="terms.html">Terms</a><a href="privacy.html">Privacy</a></p>
</footer>

</div>
<script src="js/config.js"></script>
<script src="js/site.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
